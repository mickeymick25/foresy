name: 🚀 CI/CD Pipeline - Clean Architecture

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  RAILS_ENV: test
  RUBY_VERSION: 3.4.8

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 🧪 TESTS, COVERAGE & ARCHITECTURE — RSpec + assertion Cobertura + gate DDD
  # ═══════════════════════════════════════════════════════════════
  tests:
    name: 🧪 Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: foresy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🧩 Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: "2.6.2"
          bundler-cache: true

      - name: 🔐 Validate secrets
        run: |
          if [[ -z "$SECRET_KEY_BASE" || -z "$JWT_SECRET" ]]; then
            echo "⚠️  Warning: Required secrets not configured"
            echo "ℹ️  Some features may not work properly without secrets"
            echo "🔧 Configure secrets in Repository Settings → Secrets and variables → Actions"
          else
            echo "✅ Secrets validated"
          fi
        env:
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}

      - name: 🗄️ Setup database
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/foresy_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
        run: |
          bundle exec rails db:drop db:create db:schema:load
          echo "✅ Database ready"

      - name: 🧪 Run RSpec tests with Coverage
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/foresy_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
          COVERAGE: true
        run: |
          echo "🧪 Running RSpec with coverage..."
          bundle exec rspec \
            --format progress \
            --format RspecJunitFormatter \
            --out rspec.xml \
            --format json \
            --out coverage/rspec.json

      - name: 📋 Validate Coverage Report (D-2)
        if: always()
        run: |
          test -f coverage/coverage.xml || { echo "❌ coverage/coverage.xml manquant"; exit 1; }
          ruby -rrexml/document -e '
            d = REXML::Document.new(File.read("coverage/coverage.xml"))
            r = d.root
            puts "Coverage XML valide — line-rate=#{r.attributes["line-rate"]} branch-rate=#{r.attributes["branch-rate"]}"
          ' || { echo "❌ coverage/coverage.xml invalide"; exit 1; }

      - name: 🏛️ DDD Invariants (gate explicite)
        run: |
          bundle exec rspec \
            spec/models/fc08_architecture_invariants_spec.rb \
            spec/integration/p4_6_default_scope_removal_spec.rb \
            --format documentation

      - name: 📋 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            rspec.xml
            coverage/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # 🔒 SÉCURITÉ - BRUKEMAN + BUNDLE AUDIT UNIQUEMENT
  # ═══════════════════════════════════════════════════════════════
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🧩 Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: "2.6.2"
          bundler-cache: true

      - name: 🔍 Brakeman Security Scan
        run: |
          echo "🔍 Running Brakeman security analysis..."
          # P1 revue CI co-CTO (16/09) : tout warning NON ignoré (config/brakeman.ignore)
          # fait échouer le job — gate « 0 warning » désormais bloquante
          bundle exec brakeman \
            --ignore-config=config/brakeman.ignore \
            --confidence-level=2
          echo "✅ Brakeman scan completed"

      - name: 🔍 Bundle Audit
        run: |
          echo "🔍 Running Bundle audit for known vulnerabilities..."
          bundle exec bundle audit check --update
          echo "✅ Bundle audit completed"

  # ═══════════════════════════════════════════════════════════════
  # 🎨 LINTING - RUBOCOP UNIQUEMENT
  # ═══════════════════════════════════════════════════════════════
  lint:
    name: 🎨 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🧩 Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: "2.6.2"
          bundler-cache: true

      - name: 🎨 Run RuboCop
        run: |
          echo "🎨 Running RuboCop linting..."
          bundle exec rubocop \
            --format progress \
            --format json \
            --out rubocop-report.json
        continue-on-error: false

      - name: 📋 Upload linting results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linting-results
          path: rubocop-report.json
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # 📖 CONTRATS API - RSWAG UNIQUEMENT
  # ═══════════════════════════════════════════════════════════════
  contracts:
    name: 📖 API Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: foresy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🧩 Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: "2.6.2"
          bundler-cache: true

      - name: 📦 Install gems
        run: |
          echo "🔍 Checking bundle status..."
          bundle check || bundle install --jobs=4 --retry=3
          echo "✅ Bundle installed"
          bundle list | grep rswag

      - name: 🔐 Setup secrets
        env:
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
        run: echo "✅ Secrets configured"

      - name: 🗄️ Setup database
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/foresy_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
        run: |
          bundle exec rails db:prepare
          echo "✅ Database ready for RSwag"

      - name: 📖 Generate & Validate RSwag
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/foresy_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
        run: |
          echo "📖 Generating Swagger/OpenAPI documentation..."
          bundle exec rake rswag:specs:swaggerize

          echo "✅ Swagger documentation generated"

      - name: 🔍 Audit Routes ↔ Swagger Exhaustiveness
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/foresy_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
        run: |
          echo "🔍 Running Routes ↔ Swagger Exhaustiveness Audit..."
          bundle exec rake swagger:audit_coverage

      - name: 📋 Upload API documentation
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: |
            swagger/v1/swagger.yaml
            doc/api/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # 🧪 TESTS E2E - CONDITIONNELS PR UNIQUEMENT
  # ═══════════════════════════════════════════════════════════════
  e2e:
    name: 🧪 End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tests, contracts]
    if: github.event_name == 'pull_request'

    # D-12 — chemin du ledger partagé entre les steps du job :
    # le serveur (création des commits) et la preuve finale (lecture rev-list)
    env:
      GIT_LEDGER_PATH: ${{ runner.temp }}/cra-ledger

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: foresy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🧩 Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: "2.6.2"
          bundler-cache: true

      - name: 🗄️ Setup database
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/foresy_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
        run: |
          bundle exec rails db:prepare
          echo "✅ Database ready for E2E"

      - name: 🚀 Start Rails server
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/foresy_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
          # D-12 — le VRAI Git Ledger est exercé par ce serveur. Ce flag reste au
          # niveau step : les acceptance specs RSpec du job ne doivent PAS l'hériter
          # (INV-D12-01 : sans =true, aucun test RSpec n'exécute le vrai ledger).
          GIT_LEDGER_REAL: 'true'
        run: |
          echo "🚀 Preparing Rails server..."
          rm -f tmp/pids/server.pid
          bundle exec rails server -e test -p 3000 -b 0.0.0.0 -d
          echo "✅ Rails server started in background"

      - name: ⏳ Wait for server to be ready
        run: |
          echo "⏳ Waiting for server to be ready..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/up 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Server is ready on port 3000"
              exit 0
            fi
            echo "  Attempt $i/30 - server not ready yet..."
            sleep 2
          done
          echo "❌ Server failed to start"
          echo "📄 Last 50 lines of log:"
          tail -n 50 log/test.log 2>/dev/null || echo "No logs available"
          curl -s http://localhost:3000/ 2>/dev/null || echo "Server not responding"
          exit 1

      - name: 🧪 Run E2E Tests
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/foresy_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
          E2E_MODE: true
        run: |
          echo "🧪 Running E2E acceptance tests..."
          bundle exec rspec spec/acceptance/ --format documentation
          echo "🧪 Running smoke tests..."
          if [ -f "./bin/e2e/smoke_test.sh" ]; then
            chmod +x ./bin/e2e/smoke_test.sh
            ./bin/e2e/smoke_test.sh
          fi

          # D-12 — scripts E2E shell hérités (réparés en D-4) : parcours HTTP complet
          # avec le VRAI Git Ledger (GIT_LEDGER_REAL=true sur le serveur ci-dessus)
          echo "🧪 Running legacy E2E shell scripts (D-12, real Git Ledger)..."
          chmod +x ./bin/e2e/e2e_cra_lifecycle.sh ./bin/e2e/e2e_auth_flow.sh
          ./bin/e2e/e2e_cra_lifecycle.sh
          ./bin/e2e/e2e_auth_flow.sh

          # D-12 — PREUVE : le lock a bien créé un commit Git dans le ledger
          # (pas seulement HTTP 200 — cf. ambiguïté historique du step 10 du script)
          echo "🔍 D-12 proof: verifying the REAL Git ledger commit..."
          git -C "$GIT_LEDGER_PATH" log --oneline | head -5
          LEDGER_COMMITS=$(git -C "$GIT_LEDGER_PATH" rev-list --count HEAD)
          echo "Ledger commits: $LEDGER_COMMITS"
          if [ "$LEDGER_COMMITS" -lt 1 ]; then
            echo "❌ D-12: aucun commit dans le ledger — HTTP 200 seul est insuffisant"
            exit 1
          fi
          echo "✅ E2E tests completed"

  # ═══════════════════════════════════════════════════════════════
  # 🚀 QUALITY GATE - RÉSUMÉ FINAL
  # ═══════════════════════════════════════════════════════════════
  quality-gate:
    name: 🚀 Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [tests, security, lint, contracts, e2e]
    if: always()

    steps:
      - name: 📊 Summary Report
        shell: bash
        run: |
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║                    CI/CD QUALITY GATE                        ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          echo ""

          # Status des jobs
          echo "📋 Jobs Status:"
          echo "  🧪 Tests:           ${{ needs.tests.result }}"
          echo "  🔒 Security:        ${{ needs.security.result }}"
          echo "  🎨 Linting:         ${{ needs.lint.result }}"
          echo "  📖 Contracts:       ${{ needs.contracts.result }}"
          echo "  🧪 E2E:             ${{ needs.e2e.result || 'skipped (not PR)' }}"
          echo ""

          # Validation finale — P0 revue CI co-CTO (16/09) : l'E2E est BLOQUANT sur les PR.
          # Hors PR (push main/develop), le job E2E est 'skipped' par design et n'invalide pas la gate.
          E2E_OK=false
          if [[ "${{ needs.e2e.result }}" == "success" || "${{ needs.e2e.result }}" == "skipped" ]]; then
            E2E_OK=true
          fi
          if [[ "${{ needs.tests.result }}" == "success" &&
                "${{ needs.security.result }}" == "success" &&
                "${{ needs.lint.result }}" == "success" &&
                "${{ needs.contracts.result }}" == "success" &&
                "${E2E_OK}" == "true" ]]; then
            echo "🎉 ALL QUALITY GATES PASSED! ✅"
            echo "🚀 Ready for production!"
            exit 0
          else
            echo "❌ SOME QUALITY GATES FAILED!"
            echo "🔧 Please fix the issues before merging"
            echo "Failed jobs:"
            [[ "${{ needs.tests.result }}" != "success" ]] && echo "  - Tests: ${{ needs.tests.result }}"
            [[ "${{ needs.security.result }}" != "success" ]] && echo "  - Security: ${{ needs.security.result }}"
            [[ "${{ needs.lint.result }}" != "success" ]] && echo "  - Linting: ${{ needs.lint.result }}"
            [[ "${{ needs.contracts.result }}" != "success" ]] && echo "  - Contracts: ${{ needs.contracts.result }}"
            if [[ "${E2E_OK}" != "true" ]]; then echo "  - E2E: ${{ needs.e2e.result }}"; fi
            exit 1
          fi

          echo ""
          echo "📊 Artifacts generated:"
          echo "  📋 Test results: available for 7 days"
          echo "  📊 Coverage reports: available for 7 days"
          echo "  📖 API documentation: available for 30 days"
          echo "  🎨 Linting reports: available for 7 days"
          echo ""
          echo "✨ CI/CD Pipeline completed successfully!"
